<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>diffreview</title>
    <script>
      // Theme is decided by: saved choice > system preference > dark default.
      // Kumo theming is driven by data-mode on the root element.
      (function () {
        try {
          const stored = localStorage.getItem("diffreview-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.mode = stored;
            return;
          }
        } catch {}
        document.documentElement.dataset.mode = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
